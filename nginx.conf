# Configuration nginx du jeu MoneyClick (copiée dans l'image par le Dockerfile)
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compression des fichiers texte (pages plus légères)
    gzip on;
    gzip_types text/css application/javascript;

    # Pages du jeu
    location / {
        try_files $uri $uri/ =404;
    }

    # Images, sons, CSS, JS : cache selon l'environnement (voir Dockerfile)
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|mp3)$ {
        include /etc/nginx/snippets/cache.conf;
    }

    # Point de contrôle utilisé par le HEALTHCHECK Docker
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
