# =====================================================================
#  Pipeline CI/CD du projet MoneyClick
#
#  Étapes :  1. Tests  ->  2. Build + push de l'image Docker  ->  3. Notification
#
#  - push sur la branche main  => image de DÉVELOPPEMENT (tags : dev, dev-<sha>)
#  - création d'un tag v1.0.0   => image de PRODUCTION    (tags : 1.0.0, latest)
# =====================================================================

name: CI/CD

# ---------------------------------------------------------------------
# QUAND la pipeline se lance
# ---------------------------------------------------------------------
on:
  push:
    branches: ['**']   # à chaque push, sur N'IMPORTE QUELLE branche
    tags: ['v*']       # à chaque tag qui commence par "v" (ex : v1.0.0)
# Toutes les branches : tests + notification
# main et tags v*     : tests + image Docker + notification

# ---------------------------------------------------------------------
# Valeurs utilisables dans tous les jobs
# vars.XXX = variables GitHub (Settings > Secrets and variables > Actions)
# "|| 'valeur'" = valeur par défaut si la variable n'existe pas
# ---------------------------------------------------------------------
env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

jobs:

  # ===================================================================
  # JOB 1 : récupérer le code et lancer les tests
  # ===================================================================
  test:
    name: 1. Tests
    runs-on: ubuntu-latest          # machine virtuelle Linux fournie par GitHub

    # On "exporte" le log des tests pour pouvoir l'envoyer dans la notification
    outputs:
      log: ${{ steps.tests.outputs.log }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installation des dépendances
        run: npm install

      - name: Lancement des tests
        id: tests
        run: |
          # On lance les tests et on garde une copie de la sortie dans test.log
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            # Échec : on sauvegarde les 40 dernières lignes pour la notification
            echo "log<<FIN" >> "$GITHUB_OUTPUT"
            tail -n 40 test.log >> "$GITHUB_OUTPUT"
            echo "FIN" >> "$GITHUB_OUTPUT"
            exit 1    # le job échoue -> la pipeline s'arrête ici
          fi

  # ===================================================================
  # JOB 2 : construire l'image Docker et la pousser sur GHCR
  # "needs: test" => ce job ne démarre QUE si les tests ont réussi
  # ===================================================================
  docker:
    name: 2. Build & Push Docker
    needs: test
    # Image uniquement pour main (dev) et les tags v* (prod), pas pour les autres branches
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # Droit d'écrire dans GitHub Packages (le registre ghcr.io)
    permissions:
      contents: read
      packages: write

    # On "exporte" le nom final de l'image pour la notification
    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni automatiquement par GitHub

      - name: Choix de l'environnement (dev ou prod)
        id: env
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Nom de l'image (format accepté par Docker)
        id: image
        run: |
          # Docker exige des minuscules et refuse un nom qui finit par . - ou _
          # ex : anne-gaelle-bernard/Anne-gaelle-Bernard-ci-cd.  ->  .../anne-gaelle-bernard-ci-cd
          NAME="${IMAGE_NAME,,}"
          NAME=$(echo "$NAME" | sed -E 's/[._-]+$//')
          echo "name=${REGISTRY}/${NAME}" >> "$GITHUB_OUTPUT"
          echo "Image : ${REGISTRY}/${NAME}"

      - name: Calcul des tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # Branche main -> images de développement
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag git v1.2.3 -> images de production
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENV=${{ steps.env.outputs.app_env }}

  # ===================================================================
  # JOB 3 : notification Google Chat
  # "if: always()" => s'exécute TOUJOURS, même si un job précédent a échoué
  # ===================================================================
  notify:
    name: 3. Notification Google Chat
    needs: [test, docker]
    if: always()
    runs-on: ubuntu-latest

    # Droit de lire les logs des jobs de ce run (pour expliquer un échec)
    permissions:
      actions: read

    steps:
      - name: Récupération des logs des jobs en échec
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On demande à l'API GitHub la liste des jobs du run en cours,
          # puis, pour chaque job en échec, les 30 dernières lignes de son log.
          FAILED=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id) \(.name)"' || true)

          {
            echo "log<<FIN"
            while read -r ID NAME; do
              [ -z "$ID" ] && continue
              echo "--- ${NAME} ---"
              # cut retire l'horodatage en début de ligne
              gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${ID}/logs" 2>/dev/null \
                | cut -d' ' -f2- | grep -v '^##\[group\]\|^##\[endgroup\]' | tail -n 30
            done <<< "$FAILED"
            echo "FIN"
          } >> "$GITHUB_OUTPUT"

      - name: Envoi du message
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}   # secret GitHub
          TEST_RESULT: ${{ needs.test.result }}          # success / failure / skipped
          DOCKER_RESULT: ${{ needs.docker.result }}
          TEST_LOG: ${{ needs.test.outputs.log }}
          FAIL_LOG: ${{ steps.logs.outputs.log }}       # logs de tous les jobs en échec
          IMAGE: ${{ needs.docker.outputs.image }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 0) Le secret doit exister, sinon on explique clairement pourquoi ça échoue
          if [ -z "$WEBHOOK" ]; then
            echo "::error::Le secret GOOGLE_CHAT_WEBHOOK est vide ou absent (Settings > Secrets and variables > Actions)"
            exit 1
          fi

          # 1) Statut global
          if [ "$TEST_RESULT" = "success" ] && [ "$DOCKER_RESULT" = "success" ]; then
            STATUS="✅ SUCCÈS"
            DETAILS="Image poussée : ${IMAGE}"
          elif [ "$TEST_RESULT" = "success" ] && [ "$DOCKER_RESULT" = "skipped" ]; then
            # Autre branche que main : pas d'image, c'est normal
            STATUS="✅ SUCCÈS (tests)"
            DETAILS="Tests OK — pas d'image Docker sur la branche ${GITHUB_REF_NAME} (seulement main et tags v*)"
          else
            STATUS="❌ ÉCHEC"
            DETAILS="Tests : ${TEST_RESULT} | Docker : ${DOCKER_RESULT}"
            # Logs via l'API (tests OU docker) ; sinon, repli sur le log des tests
            LOG="${FAIL_LOG:-$TEST_LOG}"
            if [ -n "$LOG" ]; then
              DETAILS="${DETAILS}
          Raison de l'échec :
          \`\`\`${LOG}\`\`\`"
            fi
          fi

          # 2) Texte du message
          TEXT="*Pipeline CI/CD* : ${STATUS}
          Dépôt : ${GITHUB_REPOSITORY} (${GITHUB_REF_NAME})
          Commit : ${GITHUB_SHA::7} par ${GITHUB_ACTOR}
          Message : ${COMMIT_MSG%%$'\n'*}
          Détails : ${RUN_URL}
          ${DETAILS}"

          # 3) Envoi vers Google Chat (jq fabrique un JSON valide)
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sS --fail -X POST \
                -H 'Content-Type: application/json; charset=UTF-8' \
                -d @- "$WEBHOOK"
