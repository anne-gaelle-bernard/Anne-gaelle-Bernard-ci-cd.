# =====================================================================
#  Pipeline CI/CD du projet MoneyClick
#
#  Étapes :  1. Tests  ->  2. Build + push de l'image Docker  ->  3. Notification
#
#  - push sur la branche main  => image de DÉVELOPPEMENT (tags : dev, dev-<sha>)
#  - création d'un tag v1.0.0   => image de PRODUCTION    (tags : 1.0.0, latest)
# =====================================================================

name: CI/CD

# ---------------------------------------------------------------------
# QUAND la pipeline se lance
# ---------------------------------------------------------------------
on:
  push:
    branches: [main]   # à chaque push sur main
    tags: ['v*']       # à chaque tag qui commence par "v" (ex : v1.0.0)

# ---------------------------------------------------------------------
# Valeurs utilisables dans tous les jobs
# vars.XXX = variables GitHub (Settings > Secrets and variables > Actions)
# "|| 'valeur'" = valeur par défaut si la variable n'existe pas
# ---------------------------------------------------------------------
env:
  NODE_VERSION: ${{ vars.NODE_VERSION || '20' }}
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || github.repository }}

jobs:

  # ===================================================================
  # JOB 1 : récupérer le code et lancer les tests
  # ===================================================================
  test:
    name: 1. Tests
    runs-on: ubuntu-latest          # machine virtuelle Linux fournie par GitHub

    # On "exporte" le log des tests pour pouvoir l'envoyer dans la notification
    outputs:
      log: ${{ steps.tests.outputs.log }}

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installation des dépendances
        run: npm install

      - name: Lancement des tests
        id: tests
        run: |
          # On lance les tests et on garde une copie de la sortie dans test.log
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            # Échec : on sauvegarde les 40 dernières lignes pour la notification
            echo "log<<FIN" >> "$GITHUB_OUTPUT"
            tail -n 40 test.log >> "$GITHUB_OUTPUT"
            echo "FIN" >> "$GITHUB_OUTPUT"
            exit 1    # le job échoue -> la pipeline s'arrête ici
          fi

  # ===================================================================
  # JOB 2 : construire l'image Docker et la pousser sur GHCR
  # "needs: test" => ce job ne démarre QUE si les tests ont réussi
  # ===================================================================
  docker:
    name: 2. Build & Push Docker
    needs: test
    runs-on: ubuntu-latest

    # Droit d'écrire dans GitHub Packages (le registre ghcr.io)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # fourni automatiquement par GitHub

      - name: Choix de l'environnement (dev ou prod)
        id: env
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "app_env=production" >> "$GITHUB_OUTPUT"
          else
            echo "app_env=development" >> "$GITHUB_OUTPUT"
          fi

      - name: Calcul des tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Branche main -> images de développement
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag git v1.2.3 -> images de production
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_ENV=${{ steps.env.outputs.app_env }}

  # ===================================================================
  # JOB 3 : notification Google Chat
  # "if: always()" => s'exécute TOUJOURS, même si un job précédent a échoué
  # ===================================================================
  notify:
    name: 3. Notification Google Chat
    needs: [test, docker]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Envoi du message
        env:
          WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}   # secret GitHub
          TEST_RESULT: ${{ needs.test.result }}          # success / failure / skipped
          DOCKER_RESULT: ${{ needs.docker.result }}
          TEST_LOG: ${{ needs.test.outputs.log }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 1) Statut global
          if [ "$TEST_RESULT" = "success" ] && [ "$DOCKER_RESULT" = "success" ]; then
            STATUS="✅ SUCCÈS"
            DETAILS="Image poussée : ${REGISTRY}/${IMAGE_NAME,,}"
          else
            STATUS="❌ ÉCHEC"
            DETAILS="Tests : ${TEST_RESULT} | Docker : ${DOCKER_RESULT}"
            if [ -n "$TEST_LOG" ]; then
              DETAILS="${DETAILS}
          Logs des tests :
          \`\`\`${TEST_LOG}\`\`\`"
            fi
          fi

          # 2) Texte du message
          TEXT="*Pipeline CI/CD* : ${STATUS}
          Dépôt : ${GITHUB_REPOSITORY} (${GITHUB_REF_NAME})
          Commit : ${GITHUB_SHA::7} par ${GITHUB_ACTOR}
          Message : ${COMMIT_MSG%%$'\n'*}
          Détails : ${RUN_URL}
          ${DETAILS}"

          # 3) Envoi vers Google Chat (jq fabrique un JSON valide)
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sS --fail -X POST \
                -H 'Content-Type: application/json; charset=UTF-8' \
                -d @- "$WEBHOOK"
